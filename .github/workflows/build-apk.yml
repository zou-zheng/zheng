name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'minghui-android-source.zip'
      - 'minghui-android-source-v103.zip'
      - 'minghui-android-source-v104.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MINGHUI_KEYSTORE_PASSWORD: ${{ secrets.MINGHUI_KEYSTORE_PASSWORD }}
      MINGHUI_KEY_ALIAS: minghui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android project
        run: unzip -q minghui-android-source-v104.zip

      - name: Restore stable signing key
        env:
          MINGHUI_KEYSTORE_BASE64: ${{ secrets.MINGHUI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$MINGHUI_KEYSTORE_BASE64" ]; then
            echo "$MINGHUI_KEYSTORE_BASE64" | base64 --decode > android/minghui-release.jks
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: minghui-learning-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
